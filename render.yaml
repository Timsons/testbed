# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One free web service: it builds the React client (npm run build) and runs
# the Express server, which serves the built client and the /api/* routes
# from the same process (see server/index.js). That's the whole app on a
# single free instance — nothing else to provision.
#
# IMPORTANT — read before relying on this in anything but a demo:
# the free plan has no persistent disk, so the SQLite file at
# server/data.db (all test cases, bugs, screenshots, settings) is wiped
# every time the service redeploys OR wakes up from spinning down after
# 15 minutes idle. See the "Data persistence" note in README.md's Deploy
# section for the paid-plan fix.
services:
  - type: web
    name: testbed
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      # Optional: set in the Render dashboard (Environment tab) if you want
      # failed-test-run alerts posted to Discord. Left blank and unsynced so
      # the value never has to live in this file or in git.
      - key: DISCORD_WEBHOOK_URL
        sync: false
      # Optional: only needed if the app is ever served from a different
      # public URL than the one Render assigns it (see .env.example).
      - key: APP_BASE_URL
        sync: false
